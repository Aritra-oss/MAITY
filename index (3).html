<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songs</title>
<style>
  :root {
    --bg1: #1a1030;
    --bg2: #0b0716;
    --vinyl: #0d0d12;
    --groove: #1d1d26;
    --label: #ff7a59;
    --label-2: #ffb347;
    --text: #fff4ea;
    --muted: rgba(255,244,234,.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg2) 70%) fixed;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    overflow: hidden;
  }
  [hidden] { display: none !important; }

  /* ---------- record (shared look) ---------- */
  .record {
    position: relative; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, transparent 0 31%, rgba(0,0,0,.0) 31%),
      repeating-radial-gradient(circle at 50% 50%, var(--vinyl) 0 2px, var(--groove) 2px 3px),
      var(--vinyl);
    box-shadow: 0 10px 30px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.04);
    display: flex; align-items: center; justify-content: center;
  }
  .record::before { /* light sheen */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 20deg, transparent 0 20%, rgba(255,255,255,.09) 28%, transparent 36% 70%, rgba(255,255,255,.07) 78%, transparent 86%);
    pointer-events: none;
  }
  .record .label {
    width: 38%; aspect-ratio: 1; border-radius: 50%;
    background: linear-gradient(135deg, var(--label-2), var(--label));
    color: #2a1208; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* ---------- home ---------- */
  #home {
    width: min(100%, 440px);
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 18px;
    max-height: 100%; overflow-y: auto; padding: 8px;
    scrollbar-width: none;
  }
  #home::-webkit-scrollbar { display: none; }
  #home button {
    border: 0; background: none; cursor: pointer; padding: 0;
    transition: transform .2s cubic-bezier(.2,.8,.2,1);
  }
  #home button:hover { transform: translateY(-3px) rotate(-4deg); }
  #home button:active { transform: scale(.94); }
  #home button:focus-visible { outline: 3px solid var(--label-2); outline-offset: 4px; border-radius: 50%; }
  #home .record { width: 100%; aspect-ratio: 1; }
  #home .label { font-size: clamp(1.1rem, 5.5vw, 1.7rem); }

  /* ---------- player ---------- */
  #playerView {
    width: min(100%, 380px);
    display: flex; flex-direction: column; align-items: center; gap: 34px;
  }
  #back {
    position: fixed; top: max(16px, env(safe-area-inset-top)); left: 16px;
    width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.08); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  #back:hover { background: rgba(255,255,255,.16); }
  #back:focus-visible { outline: 3px solid var(--label-2); }
  #back svg { width: 22px; height: 22px; }

  #bigRecord { width: min(78vw, 330px); aspect-ratio: 1; animation: spin 4s linear infinite; animation-play-state: paused; will-change: transform; }
  #bigRecord.playing { animation-play-state: running; }
  #bigRecord .label { font-size: clamp(1.8rem, 10vw, 2.8rem); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .controls { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .seek { width: 100%; display: flex; align-items: center; gap: 12px; }
  .time { font-variant-numeric: tabular-nums; font-size: .82rem; color: var(--muted); min-width: 40px; }
  .time:last-child { text-align: right; }

  input[type=range] {
    -webkit-appearance: none; appearance: none; flex: 1; height: 24px; background: transparent; cursor: pointer;
    --pct: 0%;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 5px; border-radius: 5px;
    background: linear-gradient(to right, var(--label) var(--pct), rgba(255,255,255,.16) var(--pct));
  }
  input[type=range]::-moz-range-track { height: 5px; border-radius: 5px; background: rgba(255,255,255,.16); }
  input[type=range]::-moz-range-progress { height: 5px; border-radius: 5px; background: var(--label); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--text); margin-top: -5.5px; box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--text); }
  input[type=range]:focus-visible { outline: 2px solid var(--label-2); outline-offset: 2px; border-radius: 6px; }

  #toggle {
    width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer;
    background: linear-gradient(135deg, var(--label-2), var(--label)); color: #2a1208;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 26px rgba(255,122,89,.35);
    transition: transform .12s;
  }
  #toggle:active { transform: scale(.93); }
  #toggle:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }
  #toggle svg { width: 32px; height: 32px; }
  #toggle .pause { display: none; }
  #toggle.playing .pause { display: block; }
  #toggle.playing .play { display: none; }

  @media (min-width: 560px) { #home { grid-template-columns: repeat(3, 1fr); width: min(100%, 560px); } }
  @media (max-height: 640px) { #bigRecord { width: min(60vw, 220px); } #playerView { gap: 20px; } }
</style>
</head>
<body>

  <div id="home"></div>

  <div id="playerView" hidden>
    <button id="back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>

    <div id="bigRecord" class="record"><div class="label" id="bigNum"></div></div>

    <div class="controls">
      <div class="seek">
        <span class="time" id="cur">0:00</span>
        <input type="range" id="bar" min="0" max="100" step="0.1" value="0" aria-label="Seek">
        <span class="time" id="dur">0:00</span>
      </div>
      <button id="toggle" aria-label="Play / Pause">
        <svg class="play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        <svg class="pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

<script>
(function () {
  var home = document.getElementById('home');
  var view = document.getElementById('playerView');
  var audio = document.getElementById('audio');
  var bar = document.getElementById('bar');
  var cur = document.getElementById('cur');
  var dur = document.getElementById('dur');
  var toggle = document.getElementById('toggle');
  var rec = document.getElementById('bigRecord');
  var bigNum = document.getElementById('bigNum');
  var openN = null, dragging = false;

  function pad(i) { return (i < 10 ? '0' : '') + i; }
  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function paint() {
    var p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    if (!dragging) bar.value = p;
    bar.style.setProperty('--pct', (dragging ? bar.value : p) + '%');
    cur.textContent = fmt(dragging ? (bar.value / 100) * audio.duration : audio.currentTime);
    dur.textContent = fmt(audio.duration);
  }
  function setPlaying(on) {
    toggle.classList.toggle('playing', on);
    rec.classList.toggle('playing', on);
  }

  /* build the 10 buttons */
  for (var i = 1; i <= 10; i++) {
    (function (n) {
      var b = document.createElement('button');
      b.setAttribute('aria-label', 'song' + pad(n));
      b.innerHTML = '<div class="record"><div class="label">' + pad(n) + '</div></div>';
      b.addEventListener('click', function () {
        openSong(n);
        try { location.hash = 'song' + pad(n); } catch (e) {}
      });
      home.appendChild(b);
    })(i);
  }

  function openSong(n) {
    if (openN === n) return;
    openN = n;
    home.hidden = true;
    view.hidden = false;
    bigNum.textContent = pad(n);
    audio.src = 'song' + pad(n) + '.mp3';
    bar.value = 0; paint();
    var p = audio.play();
    if (p && p.catch) p.catch(function () {});
  }
  function closeSong() {
    if (openN === null) return;
    openN = null;
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    setPlaying(false);
    view.hidden = true;
    home.hidden = false;
  }

  document.getElementById('back').addEventListener('click', function () {
    closeSong();
    try { if (location.hash) history.back(); } catch (e) {}
  });

  window.addEventListener('hashchange', function () {
    var m = location.hash.match(/^#song(0[1-9]|10)$/);
    if (m) openSong(parseInt(m[1], 10)); else closeSong();
  });

  toggle.addEventListener('click', function () {
    if (audio.paused) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }
    else audio.pause();
  });

  audio.addEventListener('play', function () { setPlaying(true); });
  audio.addEventListener('playing', function () { setPlaying(true); });
  audio.addEventListener('pause', function () { setPlaying(false); });
  audio.addEventListener('ended', function () { setPlaying(false); audio.currentTime = 0; paint(); });
  audio.addEventListener('timeupdate', paint);
  audio.addEventListener('loadedmetadata', paint);
  audio.addEventListener('durationchange', paint);

  bar.addEventListener('input', function () { dragging = true; paint(); });
  bar.addEventListener('change', function () {
    if (audio.duration) audio.currentTime = (bar.value / 100) * audio.duration;
    dragging = false; paint();
  });

  /* open directly if the page is loaded with #songNN */
  var m0 = location.hash.match(/^#song(0[1-9]|10)$/);
  if (m0) openSong(parseInt(m0[1], 10));
})();
</script>
</body>
</html>
